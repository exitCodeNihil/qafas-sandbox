[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qafas-sandbox"
version = "0.2.0"
description = "Python client for the Qafas Sandbox (qafas / control plane): acquire, exec, filesystem, upload/download, lifecycle, snapshots, sessions, preview URLs, browser CDP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qafas Sandbox" }]
keywords = ["sandbox", "agent", "llm", "coding-agent", "isolation", "podman", "firecracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/exitCodeNihil/qafas-sandbox"
Documentation = "https://github.com/exitCodeNihil/qafas-sandbox/tree/main/sdk/python#readme"
Repository = "https://github.com/exitCodeNihil/qafas-sandbox"

[project.optional-dependencies]
stream = ["websockets>=12.0"]

[tool.setuptools.packages.find]
where = ["src"]
