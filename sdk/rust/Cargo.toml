[package]
name = "qafas-sandbox"
description = "Rust SDK for Qafas Sandbox: a control plane or worker client with exec, fs, sessions, snapshots and live events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "qafas_sandbox"

[dependencies]
proto = { path = "../../crates/proto" }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# System trust roots, so an https control plane on an OS-installed CA works with no setup; SBX_CA_FILE is added on top.
rustls-native-certs = "0.8"
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tar = { workspace = true }
percent-encoding = "2"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
