global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'null'
  routes:
    - match:
        severity: critical
      receiver: 'webhook'
      continue: true

receivers:
  - name: 'null'

  - name: 'webhook'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

